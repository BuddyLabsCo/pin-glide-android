name: Android quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Read the service repository
        id: contracts
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { repository } = JSON.parse(readFileSync("config/codegen/service-contracts.json", "utf8"));
          const [owner, name] = repository.split("/");
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nrepository=${name}\n`);
          NODE
      - name: Create a read-only service repository token
        uses: actions/create-github-app-token@v3
        id: service-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.contracts.outputs.owner }}
          repositories: ${{ steps.contracts.outputs.repository }}
          permission-contents: read
      - uses: android-actions/setup-android@v4
      - name: Install the pinned Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Download the pinned service contracts
        env:
          GH_TOKEN: ${{ steps.service-token.outputs.token }}
        run: bash ./gradlew downloadServiceContracts --console=plain
      - name: Install pinned generator dependencies
        run: npm ci --ignore-scripts
      - name: Run the four static checks
        run: bash ./gradlew qualityCheck --console=plain
      - name: Build the minimal application
        run: bash ./gradlew :app:assembleDebug :app:compileReleaseKotlin :app:testDebugUnitTest --console=plain
