name: Android quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.changes.outputs.android }}
      instrumentation: ${{ steps.changes.outputs.instrumentation }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Classify changed paths
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/quality/changes.mjs "$GITHUB_EVENT_NAME" "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Test quality selection
        run: node --test scripts/quality/*.test.mjs

  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Check formatting and handwritten Kotlin file size
        run: bash ./gradlew spotlessCheck checkFileSize --build-cache --console=plain

  android:
    needs: classify
    if: needs.classify.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "cmdline-tools;23.0"
      - name: Install the pinned Android SDK
        run: |
          android="$ANDROID_HOME/cmdline-tools/23.0/bin/android"
          "$android" sdk install 'platforms/android-37.0@2.0.0' --force
          "$android" sdk install 'build-tools/36.0.0@36.0.0' --force
          "$android" sdk install 'platform-tools@37.0.3' --force
      - name: Read the service repository
        id: contracts
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { repository } = JSON.parse(readFileSync("config/codegen/service-contracts.json", "utf8"));
          const [owner, name] = repository.split("/");
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nrepository=${name}\n`);
          NODE
      - name: Create a read-only service repository token
        uses: actions/create-github-app-token@v3
        id: service-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.contracts.outputs.owner }}
          repositories: ${{ steps.contracts.outputs.repository }}
          permission-contents: read
      - name: Download the pinned service contracts
        env:
          GH_TOKEN: ${{ steps.service-token.outputs.token }}
        run: bash ./gradlew downloadServiceContracts --console=plain
      - name: Run Android static checks, compilation and JVM tests
        run: |
          bash ./gradlew detekt :app:lintDebug :app:lintRelease \
            :app:assembleDebug :app:compileReleaseKotlin :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest --build-cache --console=plain
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  instrumentation:
    needs: classify
    if: needs.classify.outputs.instrumentation == 'true'
    uses: ./.github/workflows/instrumentation.yml
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  quality:
    needs: [classify, lightweight, android, instrumentation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Require all selected checks
        env:
          QUALITY_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/quality/aggregate.mjs
