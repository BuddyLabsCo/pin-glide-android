name: Android quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install the pinned Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Install pinned generator dependencies
        run: npm ci --ignore-scripts
      - name: Test contract generation and file-size checking
        run: npm test
      - name: Run the four static checks
        run: bash ./gradlew qualityCheck --console=plain
      - name: Build the minimal application
        run: bash ./gradlew :app:assembleDebug :app:compileReleaseKotlin :app:testDebugUnitTest --console=plain
