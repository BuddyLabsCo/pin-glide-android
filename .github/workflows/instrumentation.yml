name: Android Instrumentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: "15859902"
          packages: "cmdline-tools;23.0"
      - name: Install the pinned SDK and emulator
        run: |
          android="$ANDROID_HOME/cmdline-tools/23.0/bin/android"
          "$android" sdk install 'platforms/android-37.0@2.0.0' --force
          "$android" sdk install 'build-tools/36.0.0@36.0.0' --force
          "$android" sdk install 'platform-tools@37.0.3' --force
          "$android" sdk install 'emulator@37.3.10' --force
          "$android" sdk install 'system-images/android-37.0/google_apis/x86_64@8.0.0' --force
          "$ANDROID_HOME/emulator/emulator" -version
          adb version
      - name: Read the service repository
        id: contracts
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const { repository } = JSON.parse(readFileSync("config/codegen/service-contracts.json", "utf8"));
          const [owner, name] = repository.split("/");
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nrepository=${name}\n`);
          NODE
      - name: Create a read-only service repository token
        uses: actions/create-github-app-token@v3
        id: service-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.contracts.outputs.owner }}
          repositories: ${{ steps.contracts.outputs.repository }}
          permission-contents: read
      - name: Download the pinned service contracts
        env:
          GH_TOKEN: ${{ steps.service-token.outputs.token }}
        run: bash ./gradlew downloadServiceContracts --console=plain
      - name: Assemble the debug and test APKs
        run: |
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          bash ./gradlew --stop
      - name: Enable hardware acceleration
        run: |
          sudo chown "$USER" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Boot a fresh emulator
        timeout-minutes: 8
        run: |
          mkdir -p build/instrumentation
          echo no | "$ANDROID_HOME/cmdline-tools/23.0/bin/avdmanager" create avd \
            -n pinglide-instrumentation -k 'system-images;android-37.0;google_apis;x86_64' -d pixel_2
          cores=$(nproc)
          if (( cores > 4 )); then cores=4; fi
          "$ANDROID_HOME/emulator/emulator" -avd pinglide-instrumentation -port 5554 \
            -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -memory 4096 -cores "$cores" -camera-back emulated -camera-front emulated \
            > build/instrumentation/emulator.log 2>&1 &
          bash scripts/quality/prepare-instrumentation-emulator.sh
      - name: Run the complete Instrumentation suite
        timeout-minutes: 28
        run: |
          timeout --kill-after=30s 25m bash ./gradlew :app:connectedDebugAndroidTest \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' --console=plain
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p build/instrumentation
          timeout 30s adb logcat -d -v threadtime > build/instrumentation/logcat.txt 2>&1 || true
          timeout 30s adb shell dumpsys window > build/instrumentation/windows.txt 2>&1 || true
          timeout 30s adb emu kill || true
      - name: Upload Instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            build/instrumentation/
          if-no-files-found: error
