name: Android Instrumentation

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25.0.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: ./.github/actions/setup-android-sdk
      - name: Install the pinned emulator
        run: |
          android="$ANDROID_CLI_BIN/android"
          "$android" sdk install 'emulator@37.3.10' --force
          "$android" sdk install 'system-images/android-37.0/google_apis/x86_64@8.0.0' --force
          "$ANDROID_HOME/emulator/emulator" -version
          adb version
      - uses: ./.github/actions/download-service-contracts
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Assemble the debug and test APKs
        run: |
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --build-cache --console=plain
          bash ./gradlew --stop
      - name: Enable hardware acceleration
        run: |
          sudo chown "$USER" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Boot a fresh emulator
        timeout-minutes: 8
        run: |
          mkdir -p build/instrumentation
          echo no | "$ANDROID_CLI_BIN/avdmanager" create avd \
            -n pinglide-instrumentation -k 'system-images;android-37.0;google_apis;x86_64' -d pixel_2
          cores=$(nproc)
          if (( cores > 4 )); then cores=4; fi
          "$ANDROID_HOME/emulator/emulator" -avd pinglide-instrumentation -port 5554 \
            -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -memory 4096 -cores "$cores" -camera-back emulated -camera-front emulated \
            > build/instrumentation/emulator.log 2>&1 &
          bash scripts/quality/prepare-instrumentation-emulator.sh
      - name: Run the complete Instrumentation suite
        timeout-minutes: 28
        run: |
          timeout --kill-after=30s 25m bash ./gradlew :app:connectedDebugAndroidTest \
            '-Dorg.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8' --console=plain
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p build/instrumentation
          timeout 30s adb logcat -d -v threadtime > build/instrumentation/logcat.txt 2>&1 || true
          timeout 30s adb shell dumpsys window > build/instrumentation/windows.txt 2>&1 || true
          timeout 30s adb emu kill || true
      - name: Upload Instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            build/instrumentation/
          if-no-files-found: error
