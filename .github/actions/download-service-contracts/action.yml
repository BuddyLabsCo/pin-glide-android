name: Download pinned Service contracts
description: Acquire a narrowly scoped GitHub App token and download the pinned contracts.
inputs:
  app-id:
    description: Service GitHub App ID
    required: true
  private-key:
    description: Service GitHub App private key
    required: true
  uncached:
    description: Disable build/configuration caches and daemon reuse for distribution
    default: "false"
runs:
  using: composite
  steps:
    - name: Read the service repository
      id: contracts
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from "node:fs";
        const { repository } = JSON.parse(readFileSync("config/codegen/service-contracts.json", "utf8"));
        const [owner, name] = repository.split("/");
        appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nrepository=${name}\n`);
        NODE
    - name: Create a read-only service repository token
      uses: actions/create-github-app-token@v3
      id: service-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.contracts.outputs.owner }}
        repositories: ${{ steps.contracts.outputs.repository }}
        permission-contents: read
    - name: Download the pinned service contracts
      shell: bash
      env:
        GH_TOKEN: ${{ steps.service-token.outputs.token }}
        UNCACHED: ${{ inputs.uncached }}
      run: |
        args=(downloadServiceContracts --console=plain)
        if [[ "$UNCACHED" == true ]]; then
          args+=(--no-build-cache --no-configuration-cache --no-daemon)
        fi
        bash ./gradlew "${args[@]}"
