name: Set up pinned Android SDK
description: Install the SDK shared by Android quality and Instrumentation.
runs:
  using: composite
  steps:
    - uses: android-actions/setup-android@v4.0.4
      with:
        cmdline-tools-version: "15859902"
        packages: "cmdline-tools;23.0"
    - name: Install the pinned Android SDK
      shell: bash
      run: |
        cli_bin="$ANDROID_HOME/cmdline-tools/23.0/bin"
        echo "ANDROID_CLI_BIN=$cli_bin" >> "$GITHUB_ENV"
        android="$cli_bin/android"
        "$android" sdk install 'platforms/android-37.0@2.0.0' --force
        "$android" sdk install 'build-tools/36.0.0@36.0.0' --force
        "$android" sdk install 'platform-tools@37.0.3' --force
